redis       = { workspace = true }
reqwest     = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy     = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
sha2        = "0.10"
hex         = "0.4"
quick-xml   = "0.36"
