[package]
name    = "parser_web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "parser_web"
path = "src/main.rs"

[lib]
name = "parser_web"
path = "src/lib.rs"

[dependencies]
lh_core     = { path = "../core" }
anyhow      = { workspace = true }
